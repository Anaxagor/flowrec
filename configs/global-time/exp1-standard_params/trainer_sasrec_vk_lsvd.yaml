# GLOBAL-TIME SPLIT variant of configs/exp1-standard_params/trainer_sasrec_vk_lsvd.yaml:
# identical except that every output root gains a global-time/ level, so no
# leave-one-out checkpoint, experiment folder or metrics file is overwritten
# (parity guard: tests/test_global_time_configs.py).
#
# SASRec optimizer, trainer, metrics, and output parameters for VK-LSVD.
# Identical to trainer_sasrec_yambda.yaml except for the output folders.

lr: 3.0e-4
weight_decay: 1.0e-2
betas: [0.9, 0.999]
eps: 1.0e-8

max_epochs: 500
max_steps: null
gradient_accumulation_steps: 4
max_grad_norm: 1.0
skip_non_finite_loss: false
validate_every_epochs: 1
validate_every_steps: null
run_validation_at_start: false
log_every_steps: 200
progress_bar: true
monitor: val/sft/ndcg@10
monitor_mode: max
early_stopping_patience: 10
early_stopping_mode: best
min_delta: 0.0
save_best: true
save_last: false

use_amp: true
amp_dtype: float16

device: cuda
seeds: [42, 43, 44]
ranking_ks: [5, 10, 20]

checkpoints_dir: experiments/global-time/checkpoints/exp1-standard_params/sasrec/vk_lsvd
experiments_dir: experiments/global-time/sasrec/vk_lsvd
artifacts_dir: artifacts/global-time/exp1-standard_params

# Output folders for `run_sasrec_all.py --variant NAME`. Only these keys may
# differ from the baseline, so a variant trains with identical hyperparameters
# and never overwrites the full-CE checkpoints/experiments/metrics above.
variants:
  sce:
    checkpoints_dir: experiments/global-time/checkpoints/exp1-standard_params/sasrec_sce/vk_lsvd
    experiments_dir: experiments/global-time/sasrec_sce/vk_lsvd
    artifacts_dir: artifacts/global-time/exp1-standard_params/sasrec_sce
# {dataset} is mandatory: the two VK-LSVD subsamples can run concurrently and
# must never rewrite the same metrics file.
metrics_summary_name: sasrec_{dataset}_metrics_summary.csv
# The auxiliary impression store (skips / dislikes with payload) is large for
# the popular-item subsample, so do not duplicate it into each seed's
# experiment directory.
save_interaction_store: false

comet:
  enabled: false
