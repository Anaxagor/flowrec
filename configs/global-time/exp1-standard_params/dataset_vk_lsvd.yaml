# GLOBAL-TIME SPLIT tree copy of configs/exp1-standard_params/dataset_vk_lsvd.yaml,
# UNCHANGED on purpose: VK-LSVD ships its own Global Temporal Split (train
# weeks 0-24, validation week 25, test week 26; `split_strategy: provided`
# with rolling histories and last_per_user targets), which is already the
# protocol of this tree. The file is here because the exp1 runners enumerate
# every family's dataset YAML in --config-dir; outputs still land under the
# global-time roots of the trainer YAMLs. See configs/global-time/README.md.
#
# VK-LSVD data parameters (https://huggingface.co/datasets/deepvk/VK-LSVD).
# Consumed by run_sasrec_all.py, run_tiger_sft_all.py, run_gpt2_sft_all.py and
# train_tokenizer_all.py, mirroring dataset_yambda.yaml.
#
# The full dataset (10M users, 19.6M videos, 40.8B interactions, 452 GB) does
# not fit the DataFrame pipeline; the exp1 runs use the authors' representative
# subsamples. Subsample names encode the sampling: urX = X fraction of random
# users, irX = X fraction of random items, ipX = X fraction of the most popular
# items (upX = most active users). Sizes below are extrapolated from the
# dataset card (ur0.1 = 1M users / 4B interactions), not measured:
#   ur0.01_ir0.01  ~100k users x ~196k random items, ~4M interactions (small)
#   ur0.01_ip0.01  ~100k users x ~196k most popular items, O(100M)
#                  interactions (Yambda-500M scale; needs the large-memory
#                  cluster nodes)
# Two entries are configured so both scales are available; delete or add
# entries (and their gpt2_model.yaml profiles) to change the sweep.

datasets:
  vk_lsvd_ur0.01_ir0.01:
    interactions_root: data/raw/VK-LSVD/subsamples/ur0.01_ir0.01
  vk_lsvd_ur0.01_ip0.01:
    interactions_root: data/raw/VK-LSVD/subsamples/ur0.01_ip0.01

dataset: all

# Offline source. Download the subsample folders and the item embeddings
# before submitting the training job, keeping the upstream layout:
#   data/raw/VK-LSVD/subsamples/<name>/train/week_00.parquet ... week_24.parquet
#   data/raw/VK-LSVD/subsamples/<name>/validation/week_25.parquet
#   data/raw/VK-LSVD/subsamples/<name>/test/week_26.parquet
#   data/raw/VK-LSVD/item_embeddings.npz   (metadata/item_embeddings.npz upstream)
# e.g. huggingface-cli download deepvk/VK-LSVD --repo-type dataset \
#        --include "subsamples/ur0.01_ir0.01/*" "metadata/item_embeddings.npz" \
#        --local-dir data/raw/VK-LSVD
use_hf: false
hf_repo_id: deepvk/VK-LSVD
subsample_name: null

# The datamodule reads only the item_id array from this file and removes all
# interaction items that have no embedding (the upstream file covers every
# video, so this is a consistency guarantee rather than a filter). The
# tokenizer (train_tokenizer_all.py) restricts the same file to the catalog.
embeddings_path: data/raw/VK-LSVD/item_embeddings.npz
drop_items_missing_embedding: true
semantic_id_path: null

# Positive/auxiliary partition. VK-LSVD rows are impressions with watch time
# (timespent, seconds 0-255) and boolean feedback flags (like, dislike, share,
# bookmark, click_on_author, open_comments); there are no ratings. Watched
# (>= 1 s) and not disliked impressions enter training as positives — the
# same watch-time threshold the VK semantic-ID notebook used; the remaining
# impressions (skips, dislikes) stay available in the auxiliary interaction
# store with their full payload. The destructive scope filters below would
# discard them from both streams instead.
positive_criterion: "timespent >= 1 and not dislike"
min_timespent: null
require_positive_feedback: false
# Scalar feedback score attached to every interaction (target_rating /
# history_ratings): watch time plus weighted feedback flags.
rating_mode: weighted_feedback

# The dataset's own Global Temporal Split: train weeks 0-24, validation week
# 25, test week 26 (file layout above). Each validation/test-week event is a
# next-item target with its full preceding history ("rolling"); to keep the
# evaluation cost comparable with the leave-one-out datasets only the last
# event per user and week is scored (`last_per_user`; `all` scores every
# eval-week event).
split_strategy: provided
global_history_policy: rolling
global_eval_target_mode: last_per_user
min_history_len: 1
deduplicate_consecutive: true
filter_cold_items_after_split: true
cold_item_train_source: observed

min_user_interactions: 5
min_item_interactions: 5
max_history_len: 50

# Matches the Yambda exp1 runs (batch 128 x grad-accum 4 = effective 512).
# Dense-causal SASRec logits are batch x window x catalog; the ip0.01 /
# ir0.01 catalogs are <= 196k items, below the Yambda 500M size that batch
# 128 was verified with.
batch_size: 128
eval_batch_size: 64
num_workers: 8
pin_memory: true
persistent_workers: true
train_drop_last: false

# SASRec trains identically on every exp1 dataset: dense-causal windows with
# left padding, supervising the full catalog at every position. null window
# settings default to max_history_len with non-overlapping tiling. With the
# provided split the dense train region is exactly each user's train-week
# rows.
sasrec:
  train_example_layout: dense_causal
  train_window_len: null       # defaults to max_history_len
  train_window_stride: null    # defaults to train_window_len
  history_padding: left
  include_raw_in_batch: false
  pad_item_id: 0
  pad_token_id: 0

# TIGER-specific overrides (run_tiger_sft_all.py), as for Yambda: only the
# last 128 train-week positions per user become (prefix, target) rows;
# histories still grow up to the shared max_history_len. test_eval_batch_size
# is a runner-only key for the final 20-beam evaluation.
tiger:
  train_target_policy: last_n
  train_last_n: 128
  batch_size: 2048          # train loader
  eval_batch_size: 1024     # in-training 1-beam validation
  test_eval_batch_size: 64  # final 20-beam evaluation
  num_workers: 8
  pin_memory: true
  persistent_workers: true

# GPT-2-specific batching overrides (run_gpt2_sft_all.py), as for Yambda:
# dense-causal GPT-2 supervises the ~0.9k-token semantic vocabulary, so the
# SASRec batch ceiling does not apply; windows are max_history_len x
# sem_id_len = 200 tokens. Validation and test decode with max(ks) = 20
# constrained beams.
gpt2:
  batch_size: 512           # train loader
  eval_batch_size: 128      # in-training 20-beam validation
  test_eval_batch_size: 64  # final 20-beam evaluation (runner-only key)
  num_workers: 8
  pin_memory: true
  persistent_workers: true
