# GLOBAL-TIME SPLIT variant of configs/exp1-standard_params/trainer_gpt2.yaml:
# identical except that every output root gains a global-time/ level, so no
# leave-one-out checkpoint, experiment folder or metrics file is overwritten
# (parity guard: tests/test_global_time_configs.py).
#
# Trainer parameters for the exp1 GPT-2 SFT runs.
# Consumed by scripts/exp1-standard-params/run_gpt2_sft_all.py, mirroring
# trainer_tiger.yaml / trainer_sasrec.yaml so nothing leaks between models.
#
# The AdamW lr is per dataset (tuned jointly with each architecture) and lives
# in gpt2_model.yaml; the shared optimizer settings below match the TIGER and
# SASRec exp1 runs. Per-dataset trainer overrides (the Yambda fixed-sample
# validation) live in the gpt2_model.yaml dataset profiles.

# Optimizer (lr comes from gpt2_model.yaml per dataset)
weight_decay: 1.0e-2
betas: [0.9, 0.999]
eps: 1.0e-8

# TrainerConfig (exp1 protocol: 500-epoch cap, early stopping after 10 stale
# validations, validate every epoch — the same logic as TIGER and SASRec)
max_epochs: 500
gradient_accumulation_steps: 1
max_grad_norm: 1.0
validate_every_epochs: 1
log_every_steps: 200
# In-training validation decodes with val_num_beams (gpt2_model.yaml), so the
# generation metric is monitored; val/sft/ndcg@k would be the teacher-forced
# score metric, which is not what the final evaluation reports.
monitor: val/sft/generation_ndcg@10
monitor_mode: max
early_stopping_mode: best
early_stopping_patience: 10
min_delta: 1.0e-5

# Mixed precision (enabled at runtime when CUDA is available). bfloat16
# follows the tuned GPT-2 reference configs; TIGER/SASRec use float16.
use_amp: true
amp_dtype: bfloat16

# Checkpointing
save_best: true
save_last: true

# Runtime
device: cuda             # falls back to cpu when CUDA unavailable
seeds: [42, 43, 44]

# Output directories (project-root relative)
checkpoints_dir: experiments/global-time/checkpoints/exp1-standard_params/gpt2
experiments_dir: experiments/global-time/gpt2
artifacts_dir: artifacts/global-time/exp1-standard_params
# {dataset} keeps concurrent scheduler array tasks from rewriting the same file.
metrics_summary_name: gpt2_sft_{dataset}_metrics_summary.csv

# Experiment logging
comet:
  enabled: false
