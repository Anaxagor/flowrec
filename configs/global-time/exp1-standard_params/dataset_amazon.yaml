# GLOBAL-TIME SPLIT variant of configs/exp1-standard_params/dataset_amazon.yaml.
# Identical to it except for the split block (split_strategy .. cold-item
# filter) and the pinned per-dataset cutoffs; see configs/global-time/README.md
# for the protocol and tests/test_global_time_configs.py for the parity guard.
#
# Dataset parameters
# Source: AMAZON_DATASETS + AmazonReviewDataConfig / data CLI args in
# scripts/tiger_for_small_hard.py

# Available Amazon datasets and their raw files (parquet is the primary
# interaction format; see load_interactions_frame)
datasets:
  beauty:
    reviews_path: data/raw/dataframe_format/reviews_beauty_2014.parquet
    metadata_path: data/raw/dataframe_format/meta_beauty_2014.parquet
    item_key: asin
    # 80% / 90% interaction quantiles of the positive 5-core stream
    # (198,502 interactions, 2002-06-12 .. 2014-07-23).
    global_val_timestamp: 1394150400    # 2014-03-07 UTC
    global_test_timestamp: 1399939200   # 2014-05-13 UTC
  instruments:
    reviews_path: data/raw/dataframe_format/reviews_instruments_2018.parquet
    metadata_path: data/raw/dataframe_format/meta_instruments_2018.parquet
    item_key: asin
    # 80% / 90% interaction quantiles of the positive 5-core stream
    # (184,897 interactions, 2004-03-27 .. 2018-09-28).
    global_val_timestamp: 1488499200    # 2017-03-03 UTC
    global_test_timestamp: 1507334400   # 2017-10-07 UTC

# Which dataset(s) to run: beauty | instruments | all
dataset: all

# AmazonReviewDataModule / AmazonReviewDataConfig

# Positive/auxiliary partition (pandas query over the canonical frame).
# Matching interactions form the positive training stream; the complement keeps
# rating/verified_purchase and is exposed as dm.interaction_store (saved to the
# run dir) for reward generation and negative sampling. Can also be set per
# dataset inside `datasets:`. run_sasrec.py defaults to verified purchases;
# set an explicit `positive_criterion: null` to make every review positive.
positive_criterion: "verified_purchase == True"

filter_reviews_to_metadata: true
# Global temporal split: one pair of cutoffs for every user. Train = positive
# interactions with timestamp < global_val_timestamp, validation = [val, test),
# test = >= global_test_timestamp. The cutoffs are pinned per dataset (see
# `datasets:`) instead of being re-derived from global_val_ratio /
# global_test_ratio at load time, so every model and representation job uses
# identical windows. SID coverage filtering is disabled before splitting.
# Each validation/test target keeps its full preceding history
# ("rolling"); only the last event per user and window is scored
# ("last_per_user"), which keeps the evaluation cost comparable with the
# leave-one-out runs.
split_strategy: global_time
global_history_policy: rolling
global_eval_target_mode: last_per_user
min_history_len: 1
train_all_prefixes: true
min_user_interactions: 5
min_item_interactions: 5
max_history_len: 20
deduplicate_consecutive: false
# Under a global-time split, items first seen after the validation cutoff
# have no training signal. The catalog is restricted to train-observed items
# for every model (as the Yambda / VK-LSVD configs always did), so SASRec,
# TIGER and GPT-2 rank the same candidate set and cold targets are dropped
# from validation/test instead of counting as guaranteed misses.
filter_cold_items_after_split: true
# SIDs cover the final training catalog. Preserve the pre-split stream;
# the cold-item filter above removes unavailable targets after selection.
drop_items_missing_semantic_id: false
cold_item_train_source: observed
offset_semantic_ids_by_one: true

# Dataloading
batch_size: 128
eval_batch_size: 64
num_workers: 0
pin_memory: true
persistent_workers: false
train_drop_last: false

# SASRec-specific data materialization. These override the shared dataset
# settings above without changing the TIGER pipeline's training layout.
sasrec:
  semantic_id_path: null
  train_example_layout: dense_causal
  train_window_len: null       # defaults to max_history_len
  train_window_stride: null    # defaults to train_window_len
  history_padding: left
  include_raw_in_batch: false

# TIGER-specific batching overrides (run_tiger_sft_all.py). Tuned 2026-07-30:
# fixed batch sizes, no autotuning. All other data parameters keep the shared
# settings above. test_eval_batch_size is a runner-only key for the final
# 20-beam evaluation, not a datamodule field.
tiger:
  batch_size: 2048          # train loader
  eval_batch_size: 1024     # in-training 1-beam validation
  test_eval_batch_size: 64  # final 20-beam evaluation
  num_workers: 8
  pin_memory: true
  persistent_workers: true

# GPT-2-specific batching overrides (run_gpt2_sft_all.py). GPT-2 trains dense-causal
# over semantic-ID tokens (window = max_history_len x sem_id_len = 80 tokens)
# with logits over the ~0.8k-token semantic vocabulary, so the shared
# batch_size: 128 above (sized for SASRec's catalog-wide logits) does not
# apply. Batching is an exp1 decision — only the model architecture is taken
# from the externally tuned GPT-2 configs; sizes follow the in-repo GPT-2
# reference (configs/gpt2_instruments_sft_ndcg20.json). Both validation and
# test decode with max(ks) = 20 constrained beams. The layout keys
# (train_example_layout, history_padding, ...) are forced by the runner and
# don't belong here.
gpt2:
  batch_size: 256           # train loader
  eval_batch_size: 128      # in-training 20-beam validation
  test_eval_batch_size: 128 # final 20-beam evaluation (runner-only key)
  num_workers: 4
  pin_memory: true
  persistent_workers: true
