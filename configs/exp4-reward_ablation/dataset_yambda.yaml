# Shared Yambda data parameters with model-specific overrides. The GPT-2
# profiles preserve the respective matched trial 36 / trial 4 preprocessing.

datasets:
  yambda_50m_listens:
    dataset_size: 50m
    interactions_path: data/raw/yambda/flat/50m/multi_event.parquet
    # GPT-2 trial 36: retain its exact item filtering and semantic-ID offsets.
    gpt2:
      embeddings_path: null
      drop_items_missing_embedding: false
      semantic_id_path: datasets/semantic_ids/exp2-tuned-params/yambda_50m_listens/semantic_ids.json
      offset_semantic_ids_by_one: false
      user_hash_mod: null
      train_all_prefixes: false  # last_n policy below determines active targets
      # Runner-level subset fields, as recorded in resolved_config.json.
      finetune_per_user_pool_last_n: 128
      finetune_per_user_last_n: null
      finetune_per_user_random_n: 0  # all targets in the last-128 pool
      finetune_subset_seed: 0       # inactive without random subsampling
  yambda_500m_listens:
    dataset_size: 500m
    interactions_path: data/raw/yambda/flat/500m/multi_event.parquet
    # GPT-2 trial 4 sampled50: build/audit the entire last-128 pool FIRST.
    # Select up to 50 rows per user without replacement afterwards; never
    # replace train_last_n: 128 by 50 or shorten the prefix histories.
    gpt2:
      embeddings_path: data/raw/yambda/embeddings.parquet
      drop_items_missing_embedding: true
      semantic_id_path: datasets/semantic_ids/exp2-tuned-params/yambda_500m_listens/semantic_ids.json
      offset_semantic_ids_by_one: true
      user_hash_mod: 1
      train_all_prefixes: true
      finetune_per_user_pool_last_n: 128
      finetune_per_user_last_n: null
      finetune_per_user_random_n: 50
      finetune_subset_seed: 42
      batch_size: 256
      test_eval_batch_size: 128
      num_workers: 4

dataset: all

# Offline source. Download these files before submitting the training job:
#   data/raw/yambda/flat/50m/multi_event.parquet
#   data/raw/yambda/flat/500m/multi_event.parquet
use_hf: false
hf_dataset_name: yandex/yambda
dataset_type: flat
event_file: multi_event
streaming: false
hf_recent_months: 2

# The datamodule reads only the item_id column from this file and removes all
# interaction items that have no embedding.
embeddings_path: data/raw/yambda/embeddings.parquet
drop_items_missing_embedding: true
semantic_id_path: null

# Positive listens enter SASRec training. Other event types and listens below
# 50% remain available in the auxiliary interaction store; setting the
# destructive min_played_ratio_pct filter would discard them instead.
positive_criterion: "event_type == 'listen' and played_ratio_pct >= 50"
min_played_ratio_pct: null
allowed_event_types: null
organic_filter: any

split_strategy: leave_one_out
min_history_len: 1
deduplicate_consecutive: true
filter_cold_items_after_split: true
cold_item_train_source: observed

min_user_interactions: 5
min_item_interactions: 5
max_history_len: 50

# Matches the Amazon exp1 runs (batch 128 x grad-accum 4 = effective 512).
# With dense-causal training the per-step logits are batch x window x catalog;
# the hf_recent_months: 2 window keeps the 500M catalog near 438k items, so
# batch 128 peaks around ~33 GB on the GPU. Without the time window the
# catalog is ~793k items and batch 128 OOMs an 80 GB card - lower batch_size
# here (and raise gradient_accumulation_steps to compensate) if the window is
# ever widened.
batch_size: 128
eval_batch_size: 64
num_workers: 8
pin_memory: true
persistent_workers: true
train_drop_last: false

# SASRec trains identically on every exp1 dataset: dense-causal windows with
# left padding, supervising the full catalog at every position. null window
# settings default to max_history_len with non-overlapping tiling, matching
# the Amazon configs.
sasrec:
  train_example_layout: dense_causal
  train_window_len: null       # defaults to max_history_len
  train_window_stride: null    # defaults to train_window_len
  history_padding: left
  include_raw_in_batch: false
  pad_item_id: 0
  pad_token_id: 0

# TIGER-specific overrides (run_tiger_sft_all.py). Tuned 2026-07-30: fixed
# batch sizes, no autotuning. test_eval_batch_size is a runner-only key for
# the final 20-beam evaluation, not a datamodule field.
# Training targets: only the last 128 positions per user become (prefix,
# target) rows — this tames the all-prefix explosion on the Yambda scale.
# Histories still grow up to the shared max_history_len: 50 above; all other
# data parameters keep the shared settings.
tiger:
  train_target_policy: last_n
  train_last_n: 128
  batch_size: 2048          # train loader
  eval_batch_size: 1024     # in-training 1-beam validation
  test_eval_batch_size: 64  # final 20-beam evaluation
  num_workers: 6
  pin_memory: true
  persistent_workers: true

# GPT-2 exp4 fine-tuning: matched trial 36 (50M) / trial 4 sampled50 (500M).
# Effective preparation settings verified against the saved initial models.
# Merge shared values with this section, then datasets.<name>.gpt2 above.
# Positive/auxiliary partition preserves non-listens and short listens for
# rewards. It produces the same positive targets as the initial model.
# The base dense-causal model used train_dense_match_prefix=true and stride 1;
# fine-tuning materializes those same last-128 targets as prefix_target rows,
# each with its full preceding context of up to 50 events. Catalog and
# validation/test splits are retained before the 500M random subset is drawn.
# finetune_per_user_* / finetune_subset_seed are runner subset metadata, not
# YambdaDataConfig constructor parameters.
gpt2:
  positive_criterion: "event_type == 'listen' and played_ratio_pct >= 50"
  allowed_event_types: null
  min_played_ratio_pct: null
  train_example_layout: prefix_target
  train_prefix_from_dense: false
  train_dense_match_prefix: false
  train_target_policy: last_n
  train_last_n: 128
  max_history_len: 50
  train_window_len: 50
  train_window_stride: 1
  history_padding: left
  drop_items_missing_semantic_id: true
  include_raw_in_batch: false
  keep_raw_interactions: false
  tensorized_batches: true
  seed: 42  # frozen base data protocol; distinct from the fine-tuning run seed
  batch_size: 128
  eval_batch_size: 256       # in-training beam-5 validation
  test_eval_batch_size: 64   # final beam-20 evaluation; runner-only key
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  train_drop_last: false
# Trainer overrides: 50M 128 x 16; 500M 256 x 8; effective batch 2048.
