# SASRec optimizer, trainer, metrics, and output parameters for Beauty 2023.

lr: 3.0e-4
weight_decay: 1.0e-2
betas: [0.9, 0.999]
eps: 1.0e-8

max_epochs: 500
max_steps: null
gradient_accumulation_steps: 4
max_grad_norm: 1.0
skip_non_finite_loss: false
validate_every_epochs: 1
validate_every_steps: null
run_validation_at_start: false
log_every_steps: 200
progress_bar: true
monitor: val/sft/ndcg@10
monitor_mode: max
early_stopping_patience: 10
early_stopping_mode: best
min_delta: 0.0
save_best: true
save_last: false

use_amp: true
amp_dtype: float16

device: cuda
seeds: [42, 43, 44]
ranking_ks: [5, 10, 20]

checkpoints_dir: checkpoints/exp1-standard_params/sasrec/amazon-2023
experiments_dir: experiments/sasrec/amazon-2023
artifacts_dir: artifacts/exp1-standard_params

# Output folders for `run_sasrec_all.py --variant NAME`. Only these keys may
# differ from the baseline, so a variant trains with identical hyperparameters
# and never overwrites the full-CE checkpoints/experiments/metrics above.
variants:
  sce:
    checkpoints_dir: checkpoints/exp1-standard_params/sasrec_sce/amazon-2023
    experiments_dir: experiments/sasrec_sce/amazon-2023
    artifacts_dir: artifacts/exp1-standard_params/sasrec_sce
metrics_summary_name: sasrec_amazon_2023_metrics_summary.csv
save_interaction_store: false

comet:
  enabled: false
