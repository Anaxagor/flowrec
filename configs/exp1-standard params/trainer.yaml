# Trainer parameters
# Source: TrainerConfig + optimizer / eval CLI args in
# scripts/tiger_for_small_hard.py

# Optimizer
lr: 3.0e-4                # --lr
weight_decay: 1.0e-2      # --weight-decay

# TrainerConfig
max_epochs: 500                    # --max-epochs
gradient_accumulation_steps: 4     # --grad-accum
max_grad_norm: 1.0
validate_every_epochs: 5           # --validate-every-epochs
log_every_steps: 200               # --log-every-steps
monitor: val/sft/ndcg@1
monitor_mode: max
early_stopping_patience: 10

# Mixed precision (enabled at runtime when CUDA is available)
use_amp: true            # torch.cuda.is_available()
amp_dtype: float16

# Runtime
device: cuda             # falls back to cpu when CUDA unavailable
seed: 43

# Output directories
output_dir: artifacts/tiger_sft_amazon

# Test-time evaluation logging
eval_log_every_batches: 50         # --eval-log-every-batches
