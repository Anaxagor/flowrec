# TIGER model parameters
# Source: build_model() / build_method() in scripts/tiger_for_small_hard.py

# Transformer architecture (TigerModel)
embedding_dim: 128        # --tiger-dim
num_heads: 6              # --tiger-heads
num_encoder_layers: 4     # --tiger-layers
num_decoder_layers: 4     # --tiger-layers (shared value)
dim_feedforward: 512      # --tiger-ff
d_kv: 32                  # --tiger-d-kv
dropout: 0.1              # --tiger-dropout
user_ids_count: 2000      # --user-ids-count

# Semantic-ID vocabulary (must match semantic_ids.yaml)
codebook_size: 256        # --codebook-size
# sem_id_len is derived from the datamodule (dm.sid_len)

gradient_checkpointing: true   # model.model.gradient_checkpointing_enable()

# Generation / decoding
eval_num_beams: 20             # --eval-num-beams (test generation)
val_num_beams: 1               # --val-num-beams (validation generation)
constrain_valid_sequences: true  # --constrain-valid-sequences

# Evaluation cutoffs (HR/NDCG/Coverage @k); num_return_sequences = max(ks)
ks: [5, 10, 20]                # --ks

# SFT method (build_method / SFTConfig)
sft:
  compute_train_metrics: true
  compute_eval_metrics: true
  compute_token_metrics: true
  compute_item_metrics: false
  evaluate_generation: true
  generation_topk: [1]
  # generation_num_beams / generation_num_return_sequences = val_num_beams
