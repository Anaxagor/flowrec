# Full-scale Amazon Beauty 2014 experiment (complete validation + test sets).
run_id: beauty2014_full_v1
seed: 42

# Source-of-truth invariants (stage 00 refuses to run when violated).
expected:
  num_users: 22363
  num_items: 12101
  sid_len: 4
  trie_nodes: 32879
  nodes_by_depth: [1, 256, 8786, 11735, 12101]

# Reward transforms (log-space; no implicit flooring).
transforms: [exp_T0.25, exp_T0.5, exp_T1, softplus_T1]

# Global hybrid terminal targets (spec 24.2).
hybrid_targets:
  - {alpha: 0.25, T: 0.5}
  - {alpha: 0.25, T: 1.0}
  - {alpha: 0.5,  T: 0.5}
  - {alpha: 0.5,  T: 1.0}
  - {alpha: 0.75, T: 0.5}
  - {alpha: 0.75, T: 1.0}
hybrid_grid:
  alpha: [0.25, 0.5, 0.75]
  T: [0.5, 1.0]

# User-adaptive gate (spec 25): validation-trained, frozen before test.
gate:
  reference_target: exp_T1
  label_metric: "ndcg@10"
  candidate_families:
    - reference/append_only_cyclic_parameterization
    - local_guidance
    - best_of_n
    - suffix_only_rollback
