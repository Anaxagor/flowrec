# SASRec hyperparameters for beauty_2023 (exp2, Optuna-tuned).
# Produced by scripts/exp2-tuned-params/tuning_sasrec.py: TPE sampler +
# median pruner maximizing val/sft/ndcg@10 on the leave-one-out validation split.
# Preprocessing parameters come from configs/exp2-tuned-params/dataset_amazon_2023.yaml
# and were not tuned. Best checkpoint:
# checkpoints/exp2/loo_split/initial/sasrec/beauty_2023/best.pt
#
# study: sasrec_beauty_2023_val_ndcg10_exp2
# tuned on: 2026-08-04
# trials completed: 25 (planned: 50)
# best trial: 24, best epoch: 5
# best val/sft/ndcg@10: 0.030618

# Architecture (SASRecConfig); item_vocab_size and max_history_len are
# derived from the datamodule at runtime.
d_model: 256
nhead: 2
num_layers: 1
dropout: 0.483461
pos_drop: 0.37392
initializer_range: 0.02
layer_norm_eps: 1.0e-8
pad_item_id: 0
exclude_history_in_generate: false

# Optimizer (AdamW)
lr: 0.000758786
weight_decay: 2.48057e-06
betas: [0.9, 0.999]
eps: 1.0e-8

# Fixed trainer settings the tuning ran with. gradient_accumulation_steps
# tops the dataset YAML's batch_size up to the tiger-matching effective 2048.
max_grad_norm: 1.0
gradient_accumulation_steps: 4

# SFT objective and metrics (matches exp1 sasrec_model.yaml)
sft:
  compute_train_metrics: false
  compute_eval_metrics: true
  compute_item_metrics: true
  compute_token_metrics: false
  evaluate_generation: false
  item_topk: [1, 5, 10, 20]
  pad_item_id: 0
