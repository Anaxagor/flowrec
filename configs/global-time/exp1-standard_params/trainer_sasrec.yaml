# GLOBAL-TIME SPLIT variant of configs/exp1-standard_params/trainer_sasrec.yaml:
# identical except that every output root gains a global-time/ level, so no
# leave-one-out checkpoint, experiment folder or metrics file is overwritten
# (parity guard: tests/test_global_time_configs.py).
#
# SASRec trainer parameters for the small Amazon datasets (Beauty,
# Instruments). Consumed by scripts/exp1-standard-params/run_sasrec_all.py.

# Optimizer
lr: 3.0e-4                # --lr
weight_decay: 1.0e-2      # --weight-decay
betas: [0.9, 0.999]
eps: 1.0e-8

# TrainerConfig
max_epochs: 500                    # --max-epochs
max_steps: null
gradient_accumulation_steps: 4     # --grad-accum
max_grad_norm: 1.0
skip_non_finite_loss: false
validate_every_epochs: 1           # --validate-every-epochs
validate_every_steps: null
run_validation_at_start: false
log_every_steps: 200               # --log-every-steps
progress_bar: true
monitor: val/sft/ndcg@10
monitor_mode: max
early_stopping_patience: 10
early_stopping_mode: best
min_delta: 0.0
save_best: true
save_last: false

# Mixed precision (enabled at runtime when CUDA is available)
use_amp: true            # torch.cuda.is_available()
amp_dtype: float16

# Runtime
device: cuda             # falls back to cpu when CUDA unavailable
seeds: [42, 43, 44]

# Output directories (project-root relative)
checkpoints_dir: experiments/global-time/checkpoints/exp1-standard_params/sasrec
experiments_dir: experiments/global-time/sasrec
artifacts_dir: artifacts/global-time/exp1-standard_params

# Output folders for `run_sasrec_all.py --variant NAME`. Only these keys may
# differ from the baseline, so a variant trains with identical hyperparameters
# and never overwrites the full-CE checkpoints/experiments/metrics above.
variants:
  sce:
    checkpoints_dir: experiments/global-time/checkpoints/exp1-standard_params/sasrec_sce
    experiments_dir: experiments/global-time/sasrec_sce
    artifacts_dir: artifacts/global-time/exp1-standard_params/sasrec_sce
# {dataset} keeps concurrent Beauty and Instruments Slurm array tasks from
# rewriting the same metrics file.
metrics_summary_name: sasrec_{dataset}_metrics_summary.csv
# The small-Amazon auxiliary interaction store is cheap and consumed by the
# reward pipeline, so persist it into each run directory.
save_interaction_store: true

# Experiment logging
comet:
  enabled: false
